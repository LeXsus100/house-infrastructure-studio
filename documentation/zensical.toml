[project]
site_name = "House Infrastructure Studio"
site_url = "https://lexsus100.github.io/house-infrastructure-studio/"
site_description = "Documentation for the local-only 3D residential infrastructure and MEP editor."
site_author = "Luigi Casagrande"
copyright = "Copyright &copy; 2026 Luigi Casagrande · MIT licensed"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/LeXsus100/house-infrastructure-studio"
repo_name = "LeXsus100/house-infrastructure-studio"
edit_uri = "edit/main/documentation/docs/"
use_directory_urls = true
extra_css = ["assets/stylesheets/extra.css"]
extra_javascript = ["assets/javascripts/blueprint-home.js"]

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Start here" = "getting-started/index.md" },
    { "Install and run" = "getting-started/installation.md" },
    { "Build a first project" = "getting-started/first-project.md" },
  ] },
  { "User guide" = [
    { "Recommended workflow" = "user-guide/workflow.md" },
    { "Controls" = "user-guide/controls.md" },
    { "Backups and exports" = "user-guide/backups-and-exports.md" },
  ] },
  { "Reference" = [
    { "Capabilities" = "reference/capabilities.md" },
    { "Visual identification" = "reference/visual-identification.md" },
    { "Data and privacy" = "reference/privacy.md" },
    { "License" = "reference/license.md" },
  ] },
  { "Development" = [
    { "Architecture" = "development/architecture.md" },
    { "Database schema" = "development/database.md" },
    { "Contributing" = "development/contributing.md" },
    { "Maintaining these docs" = "development/documentation.md" },
    { "Publishing releases" = "development/publishing.md" },
    { "Security policy" = "development/security.md" },
  ] },
  { "Releases" = [
    { "Changelog" = "releases/changelog.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/app-icon.svg"
favicon = "assets/app-icon.svg"
font = false
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Use light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Use dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Follow system appearance"

[project.extra]
generator = true

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/LeXsus100/house-infrastructure-studio"
name = "House Infrastructure Studio on GitHub"
